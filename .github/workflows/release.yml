name: Build & Release APK

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — avoids shallow-clone git-describe issues in llama.cpp's build-info generation

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install exact pinned NDK
        run: sdkmanager --install "ndk;28.2.13676358"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Clean build (no cache reuse — determinism check)
        run: ./gradlew clean

      - name: Assemble release APK
        run: ./gradlew assembleRelease --no-build-cache --no-configuration-cache

      - name: Locate output APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*universal-release.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify signing
        run: |
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          $BUILD_TOOLS_DIR/apksigner verify --print-certs "${{ steps.apk.outputs.path }}" || true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ steps.apk.outputs.path }}
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
