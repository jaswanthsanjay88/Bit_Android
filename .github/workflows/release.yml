name: Build & Release APK

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout exact tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — avoids shallow-clone git-describe issues in llama.cpp's build-info generation

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install exact pinned NDK
        run: sdkmanager --install "ndk;28.2.13676358"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${RELEASE_KEYSTORE_BASE64:-}" || { echo "::error::Missing RELEASE_KEYSTORE_BASE64 secret"; exit 1; }
          python3 -c "
          import os, base64, re
          raw = os.environ['RELEASE_KEYSTORE_BASE64']
          raw = re.sub(r'-----BEGIN [^-]+-----', '', raw)
          raw = re.sub(r'-----END [^-]+-----', '', raw)
          clean = re.sub(r'[^A-Za-z0-9+/=]', '', raw).replace('-', '+').replace('_', '/')
          pad = len(clean) % 4
          if pad: clean += '=' * (4 - pad)
          with open('release-key.jks', 'wb') as f: f.write(base64.b64decode(clean))
          "
          test -s release-key.jks || { echo "::error::Keystore decode produced empty file"; exit 1; }
          echo "✅ Keystore restored ($(wc -c < release-key.jks) bytes)"

      - name: Clean build (no cache reuse — determinism check)
        run: ./gradlew clean

      - name: Assemble release APK
        run: ./gradlew assembleRelease --no-build-cache --no-configuration-cache

      - name: Locate output APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*universal-release.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify signing
        run: |
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          $BUILD_TOOLS_DIR/apksigner verify --print-certs "${{ steps.apk.outputs.path }}" || true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ steps.apk.outputs.path }}
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
