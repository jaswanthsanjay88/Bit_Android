name: Build & Release APK

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — avoids shallow-clone git-describe issues in llama.cpp's build-info generation

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install exact pinned NDK
        run: sdkmanager --install "ndk;28.2.13676358"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            python3 -c "import os, base64, re; data = re.sub(r'[^A-Za-z0-9+/=]', '', os.environ['RELEASE_KEYSTORE_BASE64']); open('release-key.jks', 'wb').write(base64.b64decode(data))"
            python3 -c "import os; open('local.properties', 'a').write(f'storeFile={os.environ[\"WORKSPACE\"]}/release-key.jks\nstorePassword={os.environ[\"KEYSTORE_PASSWORD\"]}\nkeyAlias={os.environ[\"KEY_ALIAS\"]}\nkeyPassword={os.environ[\"KEY_PASSWORD\"]}\n')"
          fi

      - name: Clean build (no cache reuse — determinism check)
        run: ./gradlew clean

      - name: Assemble release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-build-cache --no-configuration-cache

      - name: Locate output APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*universal-release.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify signing
        run: |
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          $BUILD_TOOLS_DIR/apksigner verify --print-certs "${{ steps.apk.outputs.path }}" || true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ steps.apk.outputs.path }}
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
